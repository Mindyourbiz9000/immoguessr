databases:
  - name: immoguessr-db
    plan: free
    databaseName: immoguessr
    user: immoguessr

services:
  - type: web
    plan: free
    name: immoguessr
    runtime: node
    buildCommand: npm install && npm run build && npm run db:push
    startCommand: npx next start -p $PORT -H 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: immoguessr-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
